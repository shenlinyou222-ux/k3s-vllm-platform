       "id": 99,
       "type": "text",
       "title": "怎么读这个仪表盘 / 一个坑",
       "gridPos": {
        "h": 8,
        "w": 24,
        "x": 0,
        "y": 23
       },
       "options": {
        "mode": "markdown",
        "content": "### 为什么分位数用 `time_to_first_token_seconds` 而不是 `e2e_request_latency_seconds`\n\nvLLM 的 **e2e 延迟直方图桶边界是硬编码的**（`vllm/v1/metrics/buckets.py` 的\n`REQUEST_LATENCY_BUCKETS`），**最小桶 0.3 秒**：\n\n```\n0.3, 0.5, 0.8, 1.0, 1.5, 2.0, 2.5, 5, 10, 15, 20, 30, 40, 50, 60, 120, ...\n```\n\n而向量服务单条只要 **7 毫秒** → 所有请求都落进 `le=0.3` 这一个桶，\n`histogram_quantile` 只能在 [0, 0.3] 之间线性插值，算出来的\n「p50=150ms」**是插值产物，不是实测值**（真值 7.5ms，差 20 倍）。\n\n`time_to_first_token_seconds` 的桶是 **1ms 起**（`0.001, 0.005, 0.01, 0.02, 0.04, ...`），\n对 pooling 模型 **TTFT 就等于端到端延迟**（实测两者的 `_sum`/`_count` 完全相同：\n103.896s / 3961）—— 所以分位数面板用它。\n\n### 面板怎么读\n\n- **p50 / p90 / p99**：真实分位数。空载单条 ≈ 5–8 ms；批量 64 条摊薄后 ≈ 0.8–1.4 ms/条\n- **平均延迟拆解**：「排队」接近 0 说明没有积压；「推理」≈ 端到端的一半，\n  差额是 tokenize + HTTP 开销\n- **并发**：`排队等` 持续 > 0 才是真的过载信号（现在一直是 0）\n- 数据源：Prometheus `http://<WSL-IP>:30090`，抓取间隔 5s，保留 24h\n"
       }
      }
