# vllm-mask：剧情掩码实验服务（Qwen3-1.7B + npc_ctx_mask patch）
# 由流水线纳管：改这个文件 → commit → 构建 → precheck diff → apply
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-mask
  namespace: default
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: vllm-mask
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: '2026-10-30T09:45:34+08:00'
      labels:
        app: vllm-mask
    spec:
      containers:
      - args:
        - "patch -p1 -d /usr/local/lib/python3.12/dist-packages < /patch/npc_ctx_mask.patch\n\
          exec python3 -m vllm.entrypoints.openai.api_server \\\n  --model /model17\
          \ \\\n  --served-model-name q17b-flex \\\n  --host 0.0.0.0 --port 8000 \\\
          \n  --max-model-len 16384 \\\n  --gpu-memory-utilization 0.85 \\\n  --max-num-seqs\
          \ 1 \\\n  --enforce-eager \\\n  --enable-prefix-caching \\\n  --attention-backend\
          \ FLEX_ATTENTION \\\n  --trust-remote-code\n"
        command:
        - bash
        - -c
        env:
        - name: NPC_VIS_BLOCKS
          value: /mask/mask.json
        - name: VLLM_USE_FLASHINFER_SAMPLER
          value: '0'
        - name: HF_HUB_OFFLINE
          value: '1'
        image: dsh/vllm-openai-patched:1.1
        imagePullPolicy: IfNotPresent
        name: vllm
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: '4'
            memory: 10Gi
            nvidia.com/gpu: '1'
          requests:
            cpu: '1'
            memory: 4Gi
            nvidia.com/gpu: '1'
        startupProbe:
          failureThreshold: 90
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /model17
          name: model17
          readOnly: true
        - mountPath: /patch
          name: patch
          readOnly: true
        - mountPath: /mask
          name: mask
        - mountPath: /data
          name: data
          readOnly: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - hostPath:
          path: /mnt/c/Users/user/npc-models-qwen3-1.7b
          type: Directory
        name: model17
      - hostPath:
          path: /home/user/npc-mask
          type: Directory
        name: patch
      - hostPath:
          path: /home/user/npc-mask
          type: Directory
        name: mask
      - hostPath:
          path: /mnt/c/Users/user/Desktop/ds harness/data/zzz/dataset
          type: Directory
        name: data
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-mask
  namespace: default
spec:
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
  ports:
  - name: http
    nodePort: 30810
    port: 8000
    protocol: TCP
    targetPort: 8000
  selector:
    app: vllm-mask
  sessionAffinity: None
  type: NodePort
