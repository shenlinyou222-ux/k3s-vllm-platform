---
# ══════════════════════════════════════════════════════════════
#  jenkins-secret.yaml —— Jenkins 凭据（模板）
#
#  ⚠️⚠️ 这是【模板】，不含任何真实密码。
#      `REPLACE_ME_...` 必须换成你自己的值，而且【不要 commit 真值】。
#
#  三种可选做法，按环境严格程度选：
#    ① 本地单人集群（最简单）：把密码填进下面的 stringData，apply 后立刻
#       把文件从 git 里忽略掉（`git update-index --skip-worktree`），
#       或者干脆只保留本模板，真值走一条不进版本库的命令 apply。
#    ② SealedSecret（推荐给内网集群）：用 kubeseal 把值加密成
#       SealedSecret 资源，加密后的密文可以安全 commit。
#    ③ 外部 KMS / SOPS / Vault：由 CSI driver 或 operator 注入。
#
#  为什么这个文件值得单独存在（而不是内联进 jenkins.yaml）：
#    JCasC（jenkins-casc.yaml）里写的是 ${JENKINS_ADMIN_PASSWORD}，
#    由 jenkins.yaml 的 env.valueFrom.secretKeyRef 注入 —— 也就是说
#    「配置」和「凭据」是分开的：改密码只动 Secret，不用重建 CM/Deploy。
# ══════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-auth
  namespace: cicd
  labels:
    app.kubernetes.io/part-of: k3s-vllm-platform
    role: jenkins-auth
type: Opaque
stringData:
  # ── Jenkins 管理员密码（JCasC 会用它创建用户 ops）──
  # ⚠️ 换成你自己的强密码；本仓库里的这个占位符直接 apply 是【不安全的】
  admin-password: "REPLACE_ME_JENKINS_ADMIN_PASSWORD"

  # ── 说明 ──
  # 不需要 agent-secret：
  #   我们用 Kubernetes 插件【动态创建】agent pod（每个 build 一个），
  #   Jenkins 自己管凭据，不用人工去 UI 里拿 secret。
  #   见 k8s/jenkins/jenkins-casc.yaml 的 jenkins.clouds 段。
  note: "agent 用 k8s plugin 动态创建，无需 secret"
