{{- $ns := include "vllm-stack.namespace" . }}
# ══════════════════════════════════════════════════════════════════════
#  generation-config —— 服务端默认采样参数
#  等价于 k8s/live/20-vllm-gencfg-2b.yaml
#
#  ⚠️ 这是 ConfigMap，apply 后 spec 没变 → k8s 不会自动重启 pod。
#     原流水线在 deploy.sh 里检测「CM 变了但 DE 没变」补一次 rollout restart；
#     Helm 里用 Deployment 上的 checksum/gencfg annotation 达到同样效果。
# ══════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-gencfg
  namespace: {{ $ns }}
  labels:
    {{- include "vllm-stack.labels" . | nindent 4 }}
data:
  config.json: |
{{ .Values.config.gencfgBody | default "{}" | indent 4 }}
---
{{- if .Values.logging.uvicornLogConfig }}
# ── uvicorn / vLLM 日志 dictConfig（原 30 号文件）────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-uvicorn-logcfg
  namespace: {{ $ns }}
  labels:
    {{- include "vllm-stack.labels" . | nindent 4 }}
data:
  uvicorn.json: |
{{ .Values.config.uvicornLogConfigBody | default "{}" | indent 4 }}
{{- end }}
{{- if .Values.observability.enabled }}
---
# ── 可观测性环境变量（原 10 号文件里的 vllm-observability-env）────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-observability-env
  namespace: {{ $ns }}
  labels:
    {{- include "vllm-stack.labels" . | nindent 4 }}
data:
  VLLM_LOG_LEVEL: {{ .Values.observability.logLevel | quote }}
  PROMETHEUS_SCRAPE_INTERVAL: {{ .Values.observability.prometheus.scrapeInterval | quote }}
{{- end }}
