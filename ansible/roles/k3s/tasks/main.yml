---
# ══════════════════════════════════════════════════════════════════════
#  role: k3s —— 安装 k3s 并准备好 kubeconfig
# ══════════════════════════════════════════════════════════════════════

- name: 检查 k3s 是否已安装
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_bin

- name: 下载 k3s 安装脚本
  ansible.builtin.get_url:
    url: "{{ k3s_install_url }}"
    dest: /tmp/k3s-install.sh
    mode: "0755"
  when: not k3s_bin.stat.exists

- name: 安装 k3s
  ansible.builtin.command:
    cmd: /tmp/k3s-install.sh
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    # ⚠️ 关掉 traefik/servicelb —— 单节点上它们会和已有 NodePort 抢端口
    # 用 '^' 做零宽匹配加前缀，避免 '\1' 反引用（在 YAML 双引号串里是非法转义）
    INSTALL_K3S_EXEC: "server {{ k3s_disable | map('regex_replace', '^', '--disable=') | join(' ') }}"
  when: not k3s_bin.stat.exists
  register: k3s_install

- name: 设置 k3s_installed 事实
  ansible.builtin.set_fact:
    k3s_installed: true

- name: 等 k3s 起来（最多 90 秒）
  ansible.builtin.command: k3s kubectl get --raw /readyz
  register: readyz
  until: readyz.rc == 0
  retries: 30
  delay: 3
  changed_when: false
  failed_when: false

- name: 准备 ~/.kube 目录
  ansible.builtin.file:
    path: "{{ k3s_kubeconfig_dst | dirname }}"
    state: directory
    owner: "{{ models_owner }}"
    mode: "0700"

- name: 复制 kubeconfig 到用户目录
  ansible.builtin.copy:
    src: "{{ k3s_kubeconfig_src }}"
    dest: "{{ k3s_kubeconfig_dst }}"
    remote_src: true
    owner: "{{ models_owner }}"
    mode: "0600"
  # ⚠️ 只在内容不同时覆盖，避免每次 playbook 都把 mtime 改掉
  notify: reload kubeconfig note

- name: 集群节点状态
  ansible.builtin.command: k3s kubectl get nodes -o wide
  register: nodes
  changed_when: false
  failed_when: false

- name: 报告节点
  ansible.builtin.debug:
    msg: "{{ nodes.stdout_lines | default(['(取不到)']) }}"

- name: 已占用端口提示（NodePort 冲突排查用）
  ansible.builtin.shell: |
    set -o pipefail
    k3s kubectl get svc -A -o jsonpath='{range .items[*]}{.metadata.namespace}{"/"}{.metadata.name}{"  "}{.spec.ports[*].nodePort}{"\n"}{end}' 2>/dev/null | grep -v '^\s*$' || true
  register: nodeports
  changed_when: false
  failed_when: false

- name: 当前 NodePort 占用
  ansible.builtin.debug:
    msg: "{{ nodeports.stdout_lines | default(['(无)']) }}"
