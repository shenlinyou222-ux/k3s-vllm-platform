# ══════════════════════════════════════════════════════════════════════
#  ansible/inventory.ini
#
#  本栈是**单机**部署：k3s 就跑在这台 WSL2 里，所以 inventory 只有一条。
#  用 local connection 是因为 playbook 本身就在目标主机上执行。
#
#  如果有第二台机器（比如加一个 worker 节点），在这里加一行并把它放进
#  vllm_hosts 组即可 —— 角色里所有 task 都是幂等的。
# ══════════════════════════════════════════════════════════════════════

[vllm_hosts]
# 本机（WSL2 Ubuntu-24.04）
localhost ansible_connection=local

# 示例：远程节点
# node2 ansible_host=192.168.1.20 ansible_user=ubuntu

[all:vars]
ansible_python_interpreter=/usr/bin/python3
